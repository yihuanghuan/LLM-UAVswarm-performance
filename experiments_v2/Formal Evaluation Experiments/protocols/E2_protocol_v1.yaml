protocol_id: E2-commitment-timing-v1
dataset_class: formal_evaluation
status: SEALED_CANDIDATE
baseline_tag: paper-final-sim-v3
scenario_registry: ../E2/e2_scenario_registry_v1.yaml
execution_prohibited_before_final_seal: true

design:
  comparison: [Early_Commitment, Information_Aligned_Late_Commitment]
  shift_cells: [no_shift_control, registered_state_shift]
  paired_by: [scenario_id, seed, parse_snapshot, execute_snapshot]
  only_manipulated_factor: numerical commitment stage for c/r/T
  experiment_only_wrapper: ../harness/e2_commitment_wrapper.py
  production_runtime_changes_allowed: false

primary_metrics:
  executable_grounding_success:
    definition: attempts producing a valid executable mission grounded against the registered execution snapshot divided by all attempts
  state_consistency_violation_rate:
    definition: attempts whose executable fields are inconsistent with the registered execution snapshot divided by all attempts
  dynamic_infeasibility_rate:
    definition: attempts for which requested timing or geometry is dynamically infeasible under the frozen policy divided by all attempts
  correction_or_rejection_rate:
    definition: attempts with a traced deterministic correction or terminal rejection divided by all attempts; report correction and rejection separately

required_trace_fields:
  - parse-time availability and state reference
  - execution snapshot epoch and state
  - Candidate and Executable c/r/T
  - correction and rejection reason
  - configuration ID and policy hash

failure_accounting: inherit registry global_failure_accounting
