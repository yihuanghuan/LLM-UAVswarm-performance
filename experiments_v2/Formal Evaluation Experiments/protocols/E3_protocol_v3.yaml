    reason: v1/v2 targets were permutation-equivalent to initial positions and correct free assignment yielded a unique zero-motion optimum
    old_ordered_targets_m: {1: [-3, 3, 3], 2: [3, 3, 3], 3: [-3, -3, 3], 4: [3, -3, 3]}
    new_ordered_targets_m: {1: [-3, 4, 3], 2: [3, 4, 3], 3: [-2, 12, 3], 4: [0, 12, 3]}
