common:
  availability: [1, 2, 3, 4, 5, 6, 7, 8]
  participants: [1, 2, 3, 4]
  parse_epoch_s: 100.0
  execute_epoch_s: 102.0
  velocity_for_every_snapshot_uav_mps: [0.0, 0.0, 0.0]
  parse_positions_m:
    1: [-3.0, 6.0, 3.0]
    2: [-1.0, 6.0, 3.0]
    3: [1.0, 6.0, 3.0]
    4: [3.0, 6.0, 3.0]
  no_shift_control:
    execute_snapshot_equals_parse_snapshot_except_epoch: true
    execute_epoch_s: 102.0
  snapshot_contract:
    frame: world ENU
    source_and_receive_timestamps_equal_snapshot_epoch: true
    no_interpolation_or_noise_in_offline_E2_wrapper: true
  paired_design: every Early/Late and shift/no-shift cell shares scenario and seed
  target_and_displacement_contract: For every cell, generate paper unit geometry v3 from the condition-specific executable F/c/r, run the frozen allocator, and define each UAV displacement as Euclidean distance from its registered execute-snapshot position to its assigned target.

comparison_conditions:
  Early_Commitment:
    input_semantics: identical frozen Candidate and English command used by Late Commitment
    mechanism: experiment-only e2_commitment_wrapper.py
    commitment_rule: resolve at parse-time snapshot, then replace only c/r/T with absolute/explicit numerical values and retain that request at execution
    frozen_feasibility_gate: may still raise an early explicit T when required; this correction is counted and never bypassed
  Information_Aligned_Late_Commitment:
    input_semantics: untouched Candidate generated from the same command
    mechanism: frozen production resolve_execution_task at execute-time snapshot
    commitment_rule: retain relative/maintain-current/auto c, qualitative/auto r, and auto T until their frozen runtime stages
  invariant_fields: [task_id, U, F, m, s, q]
  prohibited_differences: [prompt, schema, semantic interpretation, runtime state, seed, policy, allocator, controller]

