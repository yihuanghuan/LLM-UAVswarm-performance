  paired_invariants: [initial_positions, assigned_targets, requested_T, safety_s, seed, Minimum-Jerk nominal reference]
  styles: [smooth, normal, aggressive]

E4_A:
  status: SEALED_CANDIDATE
  seeds: [54101, 54102, 54103, 54104, 54105]
  repeats_per_style_scenario: 5
  scenarios:
    - scenario_id: E4A-HORIZONTAL
      displacement_m: [0.0, 4.0, 0.0]
      displacement_norm_m: 4.0
      explicit_T_s: 4.0
      frozen_feasibility_terms_s: {velocity: 1.5, acceleration: 2.149139863647084, jerk: 2.8844991406148166, T_min: 2.8844991406148166}
      assigned_targets_m: {1: [-2.7, 12.0, 3.0], 2: [-0.9, 12.0, 3.0], 3: [0.9, 12.0, 3.0], 4: [2.7, 12.0, 3.0]}
    - scenario_id: E4A-VERTICAL
      displacement_m: [0.0, 0.0, 3.0]
      displacement_norm_m: 3.0
      explicit_T_s: 3.5
      frozen_feasibility_terms_s: {velocity: 1.125, acceleration: 1.8612097182041993, jerk: 2.6207413942088964, T_min: 2.6207413942088964}
      assigned_targets_m: {1: [-2.7, 8.0, 6.0], 2: [-0.9, 8.0, 6.0], 3: [0.9, 8.0, 6.0], 4: [2.7, 8.0, 6.0]}
    - scenario_id: E4A-DIAGONAL-3D
      displacement_m: [3.0, 4.0, 2.0]
      displacement_norm_m: 5.385164807134504
      explicit_T_s: 4.0
      frozen_feasibility_terms_s: {velocity: 2.019436802675439, acceleration: 2.493642456740583, jerk: 3.185053632824656, T_min: 3.185053632824656}
      assigned_targets_m: {1: [0.3, 12.0, 5.0], 2: [2.1, 12.0, 5.0], 3: [3.9, 12.0, 5.0], 4: [5.7, 12.0, 5.0]}
  nominal_reference_contract:
    polynomial: frozen Minimum-Jerk reference
    p0_target_T_identical_across_styles: true
    style_may_not_regenerate_or_retime_nominal_reference: true
  preregistered_directional_hypotheses:
    primary:
      control_effort: smooth lower than aggressive for integral norm commanded acceleration
      acceleration_aggressiveness: smooth lower than aggressive for peak and RMS commanded acceleration
      settling_tendency: aggressive shorter than smooth settling time
    normal: expected generally intermediate; not required to be strictly between smooth and aggressive in every scenario or metric
    tracking_RMSE: primary reported endpoint but no universal strict monotonic direction is required
    secondary_metrics_strict_monotonicity_required: false
    post_result_metric_selection: forbidden

E4_B:
  status: SEALED_CANDIDATE
  seeds: [54201, 54202, 54203, 54204, 54205]
  repeats_per_style_scenario: 5
  scenarios:
    - scenario_id: E4B-FEASIBLE-EXPLICIT-T
      geometry_source: E4A-HORIZONTAL
      requested_T_s: 4.0
      T_min_s: 2.8844991406148166
      required_outcome: T_exec equals 4.0 for every style
    - scenario_id: E4B-INFEASIBLE-EXPLICIT-T
      geometry_source: E4A-HORIZONTAL
      requested_T_s: 1.5
      T_min_s: 2.8844991406148166
      required_outcome: frozen timing policy raises T_exec to at least T_min; aggressive may not bypass velocity/acceleration/jerk feasibility
    - scenario_id: E4B-AUTO-T
      geometry_source: E4A-HORIZONTAL
      requested_T: {mode: auto}
      T_min_s: 2.8844991406148166
      expected_T_exec_s: {smooth: 3.7498488827992618, normal: 3.317174011707039, aggressive: 3.1729490546762986}
      required_outcome: style may affect T, but T_exec must be at least T_min
    - scenario_id: E4B-SAFETY-ACTIVE
      initial_positions_m: {1: [-3, -3, 3], 2: [3, -3, 3], 3: [-3, 3, 3], 4: [3, 3, 3]}
      ordered_targets_m: {1: [-3, 3, 3], 2: [3, 3, 3], 3: [-3, -3, 3], 4: [3, -3, 3]}
      requested_T_s: 6.0
      assignment_mode: safety_aware
      avoidance_mode: iapf_dual
      required_outcome: style changes neither d_hard nor safety ownership and may not bypass, disable, or force violation of hard safety
  motion_limit_contract:
    frozen_limits: {velocity_mps: 5.0, acceleration_mps2: 5.0, jerk_mps3: 10.0}
    profile_may_not_exceed_limits_for_any_style: true
    controller_clamps_may_not_be_changed_by_style: true
  authority_hierarchy: hard_safety > dynamic_feasibility > feasible_explicit_task_requirement > soft_motion_style_preference
  unauthorized_override_count:
    unit: count of violated authority predicates per attempt
    predicates:
      - feasible explicit T changed as a function of style
      - infeasible T accepted below frozen T_min or any v/a/j feasibility limit bypassed
      - auto T resolved below frozen T_min
      - d_hard, d_plan ownership, safety mapping, assignment safety, or feedback safety changed or disabled by style
      - execution profile exceeds frozen velocity, acceleration, jerk, omega, or physical controller hard clamps
      - style changes any priority above soft motion-style preference
    numerical_comparison_tolerance: 1.0e-9 for deterministic policy fields; measured limit events use the logged controller saturation predicate
  Priority_Preservation_Rate:
    numerator: attempts with unauthorized_override_count equal to zero and every decision respecting the complete authority hierarchy
    denominator: all retained E4-B attempts
    reporting: overall and separately by scenario and style

governance:
  no_post_result_duration_or_hypothesis_change: true
  production_runtime_modified: false
  accepted_formal_results_created: false
