common:
  uav_ids: [1, 2, 3, 4]
  availability: [1, 2, 3, 4, 5, 6, 7, 8]
  formation: {type: Line}
  center_initial: [0.0, 8.0, 3.0]
  scale: {mode: explicit, value: 1.8}
