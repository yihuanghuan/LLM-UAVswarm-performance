same_task_family_rule:
  SIMPLE: Identical absolute center, Circle, explicit radius, explicit duration, motion style, safety factor, and completion semantics; only U expands with N.
  UNDER_SPECIFIED: Identical maintain-current center, Circle, qualitative normal scale, auto duration, motion style, safety factor, and completion semantics; only U and legitimate state/geometry/timing resolutions vary with N.
  COMPOSITIONAL: Identical synchronized two-Circle parallel graph, centers, radii, durations, styles, safety values, and completion semantics; only the equal registered ID partition changes with N.

governance:
  all_attempt_denominator: true
  no_replacement: true
  no_post_result_scenario_changes: true
  no_method_semantic_changes: true
  old_E5_v1_immutable: true
  old_E5_v1_not_pooled: true
  formal_seeds_frozen_before_execution: true
  formal_order_frozen_before_execution: true
  human_activation_required: true
  candidate_registry_must_be_refused_by_formal_adapter: true
  engineering_smoke_is_nonformal: true
  formal_trials_created: 0
