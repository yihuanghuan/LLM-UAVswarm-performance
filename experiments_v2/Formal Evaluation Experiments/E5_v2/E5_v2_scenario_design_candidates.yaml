design_state_models:
  cold_start_spawn:
    rule: 'UAV i starts at world [0, 3*i, 0.83] m, as frozen by the PX4 multi-instance launcher.'
    z_m: 0.83
  nominal_post_readiness_snapshot:
    rule: 'UAV i is at world [0, 3*i, 1.50] m after the frozen controller startup takeoff/hover gate.'
    z_m: 1.50
  audit_rule: >-
    Every candidate is checked under both state models. The post-readiness model
    is the prospective nominal resolver input; formal execution must still log
    and assess the actual frozen fresh snapshot.

selection_rule_frozen_before_final_scenario_selection:
  feasibility_question: Does a legal physical realization exist under the frozen policy?
  excluded_objectives:
    - maximize predicted minimum distance
    - maximize workspace slack
    - minimize travel distance
    - predict or maximize mission success
    - choose a best tracking case
  E5_v2A_rule: >-
    In the listed order, take the first feasible candidate for each preregistered
    semantic coverage slot: (A1) relative+compact+auto Circle, (A2)
    maintain-current+normal+auto with a non-Circle planar geometry, and (A3)
    relative+spacious+auto Sphere. A candidate is feasible only when validation,
    center resolution, qualitative scaling, workspace geometry, allocation,
    hard-safety acceptance, final timing, and profile compilation all accept it
    under both registered design state models.
  E5_v2B_rule: >-
    In the listed order, take the first task-family definition that is feasible
    for all N in [8, 12, 16] without method-semantic changes. S1 uses the first
    explicit duration from the preregistered grid [8, 10, 12, 14, 16] seconds
    that remains unchanged by both planning and final dynamic-feasibility gates
    in every N cell. No ranking by margin is performed.

