launch_contract:
  environment:
    RMW_IMPLEMENTATION: rmw_fastrtps_cpp
    ROS_DOMAIN_ID: '42'
    GAZEBO_PLUGIN_PATH_must_include: /opt/ros/humble/lib
    FORMAL_GAZEBO_SEED: registered trial seed
  source_prefix: /home/yihuang/learning/LLM_swarm_ws/formal_install_v1/setup.bash
  xrce_agent: MicroXRCEAgent udp4 -p 8888
  px4_multi_vehicle: cd /home/yihuang/PX4-Autopilot-formal-v1 && ./Tools/simulation/gazebo-classic/sitl_multiple_run.sh -n 8 -m iris -w empty
  controller: ros2 launch ladrc_controller swarm_launch.py uav_ids:=[1,2,3,4,5,6,7,8] control_mode:=ladrc_acceleration avoidance_mode:=iapf_dual iapf_escape_mode:=id_order iapf_filter_alpha:=0.20 lfs_policy_file:=/home/yihuang/learning/LLM_swarm_ws/formal_install_v1/share/lfs_policy/config/lfs_policy.paper_current.yaml
  scheduler: ros2 launch location_allocate location_allocate.launch.py assignment_mode:=safety_aware lfs_runtime_mode:=candidate_v2 lfs_policy_file:=/home/yihuang/learning/LLM_swarm_ws/formal_install_v1/share/lfs_policy/config/lfs_policy.paper_current.yaml
  use_sim_time_commands:
    - ros2 param set /location_allocate use_sim_time true
    - for N=1..8, ros2 param set /uavN/ladrc_position_controller use_sim_time true
    - ros2 param get every listed node use_sim_time and require Boolean value true
  pre_arm_assertions:
    - PX4 and Gazebo commits equal this manifest and both clean-base patches apply exactly.
    - Every registered file and installed-package hash matches.
    - /clock advances and all production and harness ROS nodes report use_sim_time=true.
    - All eight PX4 instances and expected ROS topics are present.
    - The condition-specific P/F flags equal the registered E3 mapping.

clock_and_timestamps:
  simulator_clock_topic: /clock
  gazebo_ros_clock_source: libgazebo_ros_init.so
  ros_node_clock_domain: ROS time sourced from /clock
  wall_clock_domain: CLOCK_MONOTONIC_RAW, used only for latency and RTF denominator
  message_timestamp_rule: simulator/trajectory measurements use ROS simulation time; API latency uses monotonic wall time; domains are never subtracted from one another
  real_time_factor_collection_method: At 10 Hz record paired /clock and CLOCK_MONOTONIC_RAW samples; compute each positive delta_sim/delta_wall, plus scored-interval aggregate delta_sim/delta_wall.
  real_time_factor_reporting: median, P05, P95, minimum interval RTF, and scored-interval aggregate
  pre_run_clock_probe_required: true

