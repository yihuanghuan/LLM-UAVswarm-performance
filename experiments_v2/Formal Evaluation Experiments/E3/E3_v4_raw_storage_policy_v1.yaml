schema: E3_v4_raw_storage_policy_v1
status: FROZEN_BEFORE_FORMAL_SLOT_2
baseline_evidence_commit: baa570c79b8202c008f47800cfc277f1dcb74fa0
effective_for_campaign_positions: [2, 360]

scope:
  classification: storage_and_provenance_only
  scientific_protocol_changed: false
  formal_registry_changed: false
  formal_seed_population_changed: false
  formal_order_changed: false
  analysis_contract_changed: false
  journal_semantics_changed: false
  execution_semantics_changed: false
  production_semantics_changed: false
  activated_execution_tooling_changed: false

slot_1_historical_exception:
  campaign_position: 1
  trial_id: E3-C-01__P1_F1__S934882
  db3_remains_in_ordinary_git_history: true
  retroactive_history_rewrite_forbidden: true
  retroactive_git_lfs_migration_forbidden: true

archive:
  archive_root_environment_variable: E3_V4_RAW_ARCHIVE_ROOT
  archive_root_must_be_explicit: true
  archive_root_must_be_outside_git_repository: true
  silent_temporary_archive_root_forbidden: true
  deterministic_slot_directory: slot_{campaign_position:06d}__{trial_id}/rosbag
  source_raw_retained: required
  independent_backup_retained: required
  source_archive_sha256_equality: required
  source_and_archive_fsync: required_where_practical

ordinary_git:
  future_binary_payloads_forbidden:
    - results/formal_v4/attempts/*/raw/rosbag/*.db3
    - results/formal_v4/attempts/*/raw/rosbag/*.mcap
  compact_evidence_required:
    - attempt.json
    - metrics.json
    - metrics.log
    - campaign_context
    - campaign_journal.jsonl
    - raw_archive_inventory.json
    - raw_archive_ledger.jsonl
    - raw/rosbag/metadata.yaml
    - compact_raw_logs_and_provenance

post_attempt_sequence:
  - execute_exact_registered_trial
  - create_immutable_attempt_artifact_and_metrics
  - append_exact_attempt_to_campaign_journal
  - retain_source_raw_rosbag
  - create_and_verify_independent_raw_archive
  - write_raw_archive_inventory
  - append_raw_archive_ledger
  - commit_and_push_compact_evidence_without_future_binary_payloads

failure_semantics:
  archive_failure_classification: STORAGE_INFRASTRUCTURE_FAILURE
  pending_classification: RAW_ARCHIVE_PENDING
  scientific_retry_authorized: false
  replacement_seed_authorized: false
  additional_campaign_slot_consumed: false
  progression_blocked_until_repaired_from_retained_source: true

retention:
  delete_after_metrics: forbidden
  delete_after_journal: forbidden
  delete_after_git_push: forbidden
  delete_after_paper_analysis: forbidden
  later_deletion_requires_separate_human_archival_decision: true

frozen_sha256:
