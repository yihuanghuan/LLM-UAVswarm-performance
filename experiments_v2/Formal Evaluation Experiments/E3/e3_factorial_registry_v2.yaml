    label: four-UAV crossing target set
    command_text_for_manifest: Execute the registered four-UAV crossing target set in 6 seconds using normal motion and safety factor 1.0.
    uav_ids: [1, 2, 3, 4]
    duration_s: 6.0
    initial_positions_m: {1: [-3, -3, 3], 2: [3, -3, 3], 3: [-3, 3, 3], 4: [3, 3, 3]}
    ordered_targets_m: {1: [-3, 3, 3], 2: [3, 3, 3], 3: [-3, -3, 3], 4: [3, -3, 3]}
    structural_risk: the target geometry admits assignment-dependent opposing crossings; compare distance-only Hungarian assignment with the frozen safety-aware lexicographic refinement
    disturbance: {affected_uavs: [], axis: none, vector_N: {}, onset_s: 2.0, duration_s: 1.5}

