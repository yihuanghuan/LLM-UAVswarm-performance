registry_id: E3-exact-factorial-v2
status: SEALED
baseline_tag: paper-final-sim-v3
configuration_id: paper-current-v11-c0-f-frozen
supersession:
  classification: protocol_correction_due_to_preregistered_feasibility_inconsistency
  supersedes_registry_id: E3-exact-factorial-v1
  superseded_registry_sha256: 48d66a07c744af4fad0f483ca24c72cf30dfbcaac9468e50ea3252ce6f76ea41
  affected_scenarios: [E3-A-02, E3-C-02]
  old_duration_s: 8.0
  new_duration_s: 9.5
  exact_analytic_minimum_s: 9.229157809087656
  limiting_constraint: velocity
  duration_quantization_s: 0.5
  quantization_rule: round upward
  scientific_semantics_changed_only_by_listed_duration_correction: true
  global_population_order_and_seeds_unchanged: true
scenario_count: 6
paired_seeds: [53101, 53102, 53103, 53104, 53105, 53106, 53107, 53108, 53109, 53110, 53111, 53112, 53113, 53114, 53115]
paired_seeds_per_scenario_condition: 15
sample_size_rule: fixed before formal execution; no significance-triggered extension

common_execution:
  input_level: frozen allocator target set plus executable task fields; no LLM call
  frame: world ENU
  style: normal
  safety_s: 1.0
  q: {mode: direct}
  staging: move to exact initial geometry, require all UAVs stable for 2.0 continuous seconds, then start a new scored interaction command
  staging_is_scored: false
  scoring_start: interaction execution-command timestamp t0
  scoring_end: t0 plus registered duration plus 2.0 seconds
  timeout: registered duration plus 6.0 seconds after t0
  target_order: authoritative allocator input order shown per scenario
  target_labels_define_input_order_not_uav_ownership: true
  scenario_or_sample_extension_after_results: forbidden

factorial_mapping:
  P1:
    assignment_mode: safety_aware
    meaning: frozen safety-aware lexicographic assignment
    allocator: lexicographic-safety-aware-v2
  P0:
    assignment_mode: distance_hungarian
    meaning: standard distance-only Hungarian assignment without safety-aware lexicographic refinement
  F1:
    meaning: feedback safety ON
    avoidance_mode: iapf_dual
    iapf_escape_mode: id_order
    iapf_filter_alpha: 0.20
  F0:
    meaning: feedback safety OFF
    avoidance_mode: 'off'
    iapf_escape_mode: id_order
    iapf_filter_alpha: 0.20
  conditions:
    P1_F1: {assignment_mode: safety_aware, avoidance_mode: iapf_dual}
    P1_F0: {assignment_mode: safety_aware, avoidance_mode: 'off'}
    P0_F1: {assignment_mode: distance_hungarian, avoidance_mode: iapf_dual}
    P0_F0: {assignment_mode: distance_hungarian, avoidance_mode: 'off'}
  invariant_flags: {lfs_runtime_mode: candidate_v2, control_mode: ladrc_acceleration, policy: lfs_policy.paper_current.yaml}
  planning_assignment_comparison: distance-only Hungarian vs safety-aware lexicographic refinement
  paired_invariants:
    - same initial state
    - same target set
    - same seed
    - same controller
    - same timing
    - same feedback condition
  only_planning_difference: assignment rule
  fixed_target_ownership_for_P0: false
  no_condition_specific_tuning: true

disturbance_contract:
  mechanism: ROS 2 gazebo_plugins GazeboRosForce model plugin plus experiment-only e3_wrench_driver.py
  plugin_package_version: ros-humble-gazebo-plugins 3.9.0-1jammy.20260606.075130
  model_overlay: ../environment/patches/iris_gazebo_ros_force_v1.patch
  link: base_link
  force_frame: world
  waveform: rectangular constant force; zero torque
  timing_basis: /clock elapsed from /e3/disturbance_arm received at t0
  publish_behavior: publish registered wrench on every /clock callback during interval and one zero wrench at end
  random_component: none
  seed_relationship: identical scenario disturbance and paired seed in all four P/F conditions
  production_runtime_semantics_changed: false
  fairness: identical plugin and driver are loaded in every condition, including zero-disturbance Family A

scenarios:
