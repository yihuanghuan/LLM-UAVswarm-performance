full_method:
  lfs_runtime_mode: candidate_v2
  assignment_mode: safety_aware
  control_mode: ladrc_acceleration
  avoidance_mode: iapf_dual
  iapf_escape_mode: id_order
  policy: lfs_policy/config/lfs_policy.paper_current.yaml

common:
  availability: [1, 2, 3, 4, 5, 6, 7, 8]
  cold_start_spawn_m:
    1: [0.0, 3.0, 0.83]
    2: [0.0, 6.0, 0.83]
    3: [0.0, 9.0, 0.83]
    4: [0.0, 12.0, 0.83]
    5: [0.0, 15.0, 0.83]
    6: [0.0, 18.0, 0.83]
    7: [0.0, 21.0, 0.83]
    8: [0.0, 24.0, 0.83]
  readiness_gate: all eight PX4 instances ready, armed/offboard, and frozen fresh-state predicate satisfied before command submission
  success_common:
    - every registered task is accepted, dispatched, and reaches its registered completion event before mission timeout
    - no controller, PX4, allocator, parser, resolver, or infrastructure hard failure
    - actual d_min is at least frozen d_hard 1.50 m over the scored mission
    - no manual retry, trial deletion, or replacement seed
  no_comparison_method: true

scenarios:
  - scenario_id: E5-SIMPLE
    exact_command: Have UAVs 1 through 8 form a circle centered at [0, 12, 3] with radius 4 meters in 8 seconds using normal motion and safety factor 1.0, then hover and wait for 2 seconds.
    candidate_semantic_ground_truth:
      lfs_version: '2.1'
      mission:
        nodes:
          - type: task
            task: {task_id: 1, U: [1, 2, 3, 4, 5, 6, 7, 8], F: {type: Circle}, c: {mode: absolute, value: [0, 12, 3]}, r: {mode: explicit, value: 4}, T: {mode: explicit, value: 8}, m: normal, s: 1.0, q: {mode: hover-and-wait, duration: 2}}
    formation_geometry: paper Circle unit geometry v3, center [0,12,3], requested radius 4 m
    completion_mode: stable hover followed by 2.0 second wait
    mission_timeout_s: 20.0

  - scenario_id: E5-REL-QUAL
    exact_command: Have UAVs 1 through 8 form a spacious sphere centered at world-frame offset [3, 0, 1] meters from their current swarm centroid with automatic duration, using smooth motion and a safer safety setting.
    candidate_semantic_ground_truth:
      lfs_version: '2.1'
      mission:
        nodes:
          - type: task
            task: {task_id: 1, U: [1, 2, 3, 4, 5, 6, 7, 8], F: {type: Sphere}, c: {mode: relative, reference: current_swarm_centroid, offset: [3, 0, 1], frame: world}, r: {mode: qualitative, value: spacious}, T: {mode: auto}, m: smooth, s: 1.0, q: {mode: direct}}
    formation_geometry: paper Sphere unit geometry v3; c/r/T resolved from the frozen execution snapshot and policy
    completion_mode: stable hover
    mission_timeout_s: 25.0

  - scenario_id: E5-SEQUENTIAL
    exact_command: First, have UAVs 1 through 8 form a normal-scale circle around their current centroid with automatic duration, normal motion, and safety factor 1.0. As soon as that trajectory completes, continue all eight UAVs into a line centered at [0, 16, 4] with radius 2.25 meters in 8 seconds using smooth motion and safety factor 1.25, then hover and wait for 2 seconds.
    candidate_semantic_ground_truth:
      lfs_version: '2.1'
      mission:
        nodes:
          - type: task
            task: {task_id: 1, U: [1, 2, 3, 4, 5, 6, 7, 8], F: {type: Circle}, c: {mode: maintain_current_centroid}, r: {mode: qualitative, value: normal}, T: {mode: auto}, m: normal, s: 1.0, q: {mode: continuous}}
          - type: task
            task: {task_id: 2, U: [1, 2, 3, 4, 5, 6, 7, 8], F: {type: Line}, c: {mode: absolute, value: [0, 16, 4]}, r: {mode: explicit, value: 2.25}, T: {mode: explicit, value: 8}, m: smooth, s: 1.25, q: {mode: hover-and-wait, duration: 2}}
    formation_geometry: sequential Circle then Line using paper unit geometry v3
    relation: task 2 dispatches on task 1 trajectory completion, not stable-hover completion
    completion_mode: final stable hover followed by 2.0 second wait
    mission_timeout_s: 35.0

  - scenario_id: E5-PARALLEL
    exact_command: In parallel, UAVs 1 through 4 form a circle centered at [-4, 14, 3] with radius 2 meters in 7 seconds using smooth motion and safety factor 1.25, while UAVs 5 through 8 form a compact square around their current centroid with automatic duration, normal motion, and safety factor 1.0. Complete the parallel group synchronously.
    candidate_semantic_ground_truth:
      lfs_version: '2.1'
      mission:
        nodes:
          - type: parallel
            completion_mode: synchronized
            tasks:
              - {task_id: 1, U: [1, 2, 3, 4], F: {type: Circle}, c: {mode: absolute, value: [-4, 14, 3]}, r: {mode: explicit, value: 2}, T: {mode: explicit, value: 7}, m: smooth, s: 1.25, q: {mode: direct}}
              - {task_id: 2, U: [5, 6, 7, 8], F: {type: Polygon, sides: 4}, c: {mode: maintain_current_centroid}, r: {mode: qualitative, value: compact}, T: {mode: auto}, m: normal, s: 1.0, q: {mode: direct}}
    formation_geometry: disjoint Circle and four-sided Polygon, jointly allocated under max parallel d_plan aggregation
    completion_mode: synchronized parallel completion
    mission_timeout_s: 30.0

  - scenario_id: E5-MIXED-HIGH
    exact_command: First, have UAVs 1 through 8 form a spacious sphere centered at world-frame offset [2, 0, 1] meters from their current swarm centroid with automatic duration, smooth motion, and safety factor 1.0, continuing as soon as the trajectory completes. Then, in parallel and synchronously, have UAVs 1 through 4 form a circle centered at [-4, 18, 4] with radius 2 meters in 7 seconds using normal motion and safety factor 1.25, while UAVs 5 through 8 form a normal-scale square centered at [4, 18, 4] with automatic duration using aggressive motion and safety factor 1.0; after completion, hover and wait for 2 seconds.
    candidate_semantic_ground_truth:
      lfs_version: '2.1'
      mission:
        nodes:
          - type: task
            task: {task_id: 1, U: [1, 2, 3, 4, 5, 6, 7, 8], F: {type: Sphere}, c: {mode: relative, reference: current_swarm_centroid, offset: [2, 0, 1], frame: world}, r: {mode: qualitative, value: spacious}, T: {mode: auto}, m: smooth, s: 1.0, q: {mode: continuous}}
          - type: parallel
            completion_mode: synchronized
            tasks:
              - {task_id: 2, U: [1, 2, 3, 4], F: {type: Circle}, c: {mode: absolute, value: [-4, 18, 4]}, r: {mode: explicit, value: 2}, T: {mode: explicit, value: 7}, m: normal, s: 1.25, q: {mode: hover-and-wait, duration: 2}}
              - {task_id: 3, U: [5, 6, 7, 8], F: {type: Polygon, sides: 4}, c: {mode: absolute, value: [4, 18, 4]}, r: {mode: qualitative, value: normal}, T: {mode: auto}, m: aggressive, s: 1.0, q: {mode: hover-and-wait, duration: 2}}
    formation_geometry: sequential Sphere followed by synchronized disjoint Circle and four-sided Polygon
    relation: first task continuous into the parallel group; both parallel tasks use the same 2 second post-completion wait
    completion_mode: synchronized parallel stable completion followed by 2.0 second wait
    mission_timeout_s: 45.0

governance:
  commands_ground_truth_and_timeouts_may_not_change_after_any_formal_output: true
  comparison_methods_may_not_be_added: true
  all_attempt_denominator: true
  accepted_formal_results_created: false
